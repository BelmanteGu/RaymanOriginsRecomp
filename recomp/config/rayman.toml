# Rayman Origins (Xbox 360, RYOGNS, PT-BR) — configuração do XenonRecomp.
# Caminhos relativos a este arquivo.

[main]
file_path = "../../private/game/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "rayman_switch_tables.toml"
# Sem title update (nenhum XEXP no dump), então sem patch_file_path.

# Otimizações: manter desligadas até ter uma recompilação funcionando.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Funções save/restore de registradores — achadas por padrão de bytes
# (tools/diag). Ocorrência única cada; distâncias batem com as do SWA.
restgprlr_14_address = 0x82540C40
savegprlr_14_address = 0x82540BF0
restfpr_14_address = 0x825423CC
savefpr_14_address = 0x82542380
restvmx_14_address = 0x827DAC98
savevmx_14_address = 0x827DAA00
restvmx_64_address = 0x827DAD2C
savevmx_64_address = 0x827DAA94

# TODO: longjmp_address / setjmp_address (procurar chamadas a RtlUnwind).

